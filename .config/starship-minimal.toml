"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = """$character$directory"""

right_format = """$git_branch$git_status"""

[character]
format = "$symbol "
success_symbol = "[▲](white)"
error_symbol = "[△](red)"

[directory]
truncate_to_repo = false
truncation_symbol = '…/'
style = "italic blue"
format = '[$path]($style) '
repo_root_style = 'bold blue'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style) '

[git_branch]
format = "[$symbol$branch]($style)"
symbol = " "
style = "bright-blue"
truncation_symbol = "⋯"
truncation_length = 11
only_attached = true

[git_status]
style = "dimmed white"
format = "[$all_status$ahead_behind]($style)"
conflicted = "[!](italic bright-magenta)"
ahead = "[⇡](italic green)"
behind = "[⇣](italic red)"
diverged = "[⇡⇣](italic bright-magenta)"
untracked = "[?](italic bright-yellow)"
stashed = "[≡](italic white)"
modified = "[~](italic yellow)"
staged = "[+](italic bright-cyan)"
renamed = "[→](italic bright-blue)"
deleted = "[-](italic red)"
